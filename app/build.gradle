plugins {
    id "com.android.application"
}

android {
    namespace "com.fm.centinelaip"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.fm.centinelaip"
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName "0.5.0-alpha06"

        ndk {
            // APK optimizada para teléfonos Android modernos.
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Firma local de desarrollo para que el APK entregado sea instalable.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
    compileOnly "androidx.annotation:annotation:1.6.0"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.camera:camera-camera2:1.5.3"
    implementation "androidx.camera:camera-lifecycle:1.5.3"
    implementation "androidx.camera:camera-view:1.5.3"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "androidx.media3:media3-exoplayer:1.9.4"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.9.4"
    implementation "androidx.media3:media3-ui:1.9.4"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.27.0"

    testImplementation "junit:junit:4.13.2"
}
