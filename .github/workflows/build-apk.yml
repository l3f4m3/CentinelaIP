name: Validar y compilar APK

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ADA v0.5.0-alpha02
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Descargar YOLO26n oficial
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            --output app/src/main/assets/yolo26n.onnx \
            https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.onnx
          echo "2e947b787d9e787b93a16772a5f55b1d4d8c4d86f53146149c5d6a642442d6f7  app/src/main/assets/yolo26n.onnx" | sha256sum --check

      - name: Ejecutar pruebas unitarias
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:testReleaseUnitTest 2>&1 | tee gradle-test.log

      - name: Compilar APK release instalable
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Verificar APK y firma
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          java -jar "$SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app-release.sha256

      - name: Publicar diagnóstico de CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ADA-v0.5.0-alpha02-CI-logs
          path: |
            gradle-test.log
            gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar APK validada
        uses: actions/upload-artifact@v4
        with:
          name: ADA-v0.5.0-alpha02-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.sha256
            app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 30
