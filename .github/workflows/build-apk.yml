name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CentinelaIP v0.4.1
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Descargar YOLO26n oficial
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            --output app/src/main/assets/yolo26n.onnx \
            https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.onnx
          echo "2e947b787d9e787b93a16772a5f55b1d4d8c4d86f53146149c5d6a642442d6f7  app/src/main/assets/yolo26n.onnx" | sha256sum --check

      - name: Compilar APK release instalable
        run: gradle --no-daemon :app:assembleRelease

      - name: Verificar resultado
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CentinelaIP-v0.4.1-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar herramienta de firma Android
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-35
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 30
